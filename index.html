<style>
  :root{
    --bg:#f4f6fb; --surface:#ffffff; --text:#14213d; --muted:#5b6478;

  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f1420; --surface:#171d2d; --text:#eef1fa; --muted:#9aa4bd;
           --line:#262e45; --accent:#7b95ff; --accent-d:#9fb2ff; --logo-bg:#1f2740; --chip:#232c48; }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Hind Siliguri",system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px}
  header{padding:56px 0 24px;text-align:center}
  header h1{font-size:clamp(1.6rem,4vw,2.5rem);font-weight:700;line-height:1.35;max-width:860px;margin:0 auto}
  header p{color:var(--muted);margin:14px auto 0;font-size:1.05rem;max-width:720px}
  .tools{display:flex;flex-direction:column;align-items:center;gap:16px;margin-top:26px}
  .search{position:relative;width:100%;max-width:560px;display:flex;align-items:center;height:54px;
    background:var(--surface);border:1px solid var(--line);border-radius:999px;
    box-shadow:0 2px 10px rgba(20,33,61,.07);transition:border-color .2s,box-shadow .2s}
  .search:hover{box-shadow:0 4px 16px rgba(20,33,61,.12)}
  .search:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px rgba(42,75,215,.16)}
  .search .ico{position:absolute;left:20px;width:20px;height:20px;color:var(--muted);pointer-events:none}
  .search input{flex:1;height:100%;border:0;background:transparent;color:var(--text);font:inherit;font-size:1rem;
    padding:0 52px 0 52px;border-radius:999px;text-align:left;outline:none;-webkit-appearance:none;appearance:none}
  .search input::placeholder{color:var(--muted)}
  .search input::-webkit-search-cancel-button{display:none}
  .search .clear{position:absolute;right:12px;width:30px;height:30px;border:0;border-radius:50%;cursor:pointer;
    background:var(--chip);color:var(--muted);display:none;place-items:center;font-size:1.1rem;line-height:1}
  .search .clear.show{display:grid}
  .search .clear:hover{color:var(--accent)}
  .search .clear:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .count{color:var(--muted);font-size:.9rem;margin-top:-4px}
  .chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
  .chip{border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-size:.92rem;
    padding:6px 16px;border-radius:999px;cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .grid{display:grid;gap:22px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));padding:28px 0 64px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px 22px;
    display:flex;flex-direction:column;align-items:center;text-align:center;transition:transform .2s,box-shadow .2s}
  .card:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(20,33,61,.12)}
  .logo{width:84px;height:84px;border-radius:50%;background:#fff;display:grid;place-items:center;
    overflow:hidden;margin:0 auto 14px;border:1px solid var(--line)}
  .logo img{width:100%;height:100%;object-fit:cover;object-position:center;display:block}
  .logo span{font-weight:700;font-size:1.9rem;color:#2a4bd7}
  .badge{display:inline-block;background:var(--chip);color:var(--accent);font-size:.78rem;font-weight:600;
    padding:2px 12px;border-radius:999px;margin-bottom:10px}
  .card h2{font-size:1.2rem;font-weight:600;margin-bottom:6px}
  .card p{color:var(--muted);font-size:.95rem;flex:1;margin-bottom:20px;white-space:pre-line}
  .btn{display:block;width:100%;text-align:center;text-decoration:none;background:var(--accent);color:#fff;
    padding:11px 16px;border-radius:10px;font-weight:600;transition:background .2s}
  .btn:hover{background:var(--accent-d)}
  .btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0}
  footer{text-align:center;color:var(--muted);padding:0 0 32px;font-size:.9rem}
</style>

const clean = t => t.split("\n").map(l => l.trim()).join("\n").trim();
const btnText = { "Website":"Visit Website", "Agency":"Visit Website", "Marketer":"View Facebook Profile", "Facebook Page":"Visit Facebook Page" };

const grid = document.getElementById("grid");
const chipsBox = document.getElementById("chips");
const input = document.getElementById("q");
let activeType = "All";

function card(s){
  const el = document.createElement("article");
  el.className = "card";

  const logo = document.createElement("div");
  logo.className = "logo";
  const fallback = () => { logo.innerHTML = ""; const sp = document.createElement("span"); sp.textContent = s.name.charAt(0); logo.appendChild(sp); };
  if(s.logo){
    const img = new Image();
    img.alt = s.name + " logo";
    img.width = 84; img.height = 84; img.referrerPolicy = "no-referrer";
    let triedLocal = false;
    img.onerror = () => {
      if(s.logoLocal && !triedLocal){ triedLocal = true; img.src = s.logoLocal; }
      else fallback();
    };
    img.src = s.logo;
    logo.appendChild(img);
  } else fallback();

  const badge = document.createElement("span"); badge.className = "badge"; badge.textContent = s.type;
  const h = document.createElement("h2"); h.textContent = s.name;
  const p = document.createElement("p");  p.textContent = clean(s.desc);
  const a = document.createElement("a");
  a.className = "btn"; a.href = s.url; a.target = "_blank"; a.rel = "noopener noreferrer";
  a.textContent = s.btn || btnText[s.type] || "Visit"; a.title = s.name + " \u2013 " + s.type;

  el.append(logo, badge, h, p, a);
  return el;
}

function render(){
  const t = input.value.trim().toLowerCase();
  const list = sites.filter(s =>
    (activeType === "All" || s.type === activeType) &&
    (s.name + " " + clean(s.desc) + " " + s.type).toLowerCase().includes(t));
  document.getElementById("count").textContent = "Showing " + list.length + " of " + sites.length;
  grid.innerHTML = "";
  if(!list.length){ grid.innerHTML = '<p class="empty">No results found.</p>'; return; }
  list.forEach(s => grid.appendChild(card(s)));
}

function buildChips(){
  const types = ["All", ...new Set(sites.map(s => s.type))];
  types.forEach(type => {
    const b = document.createElement("button");
    b.className = "chip"; b.type = "button"; b.textContent = type;
    b.setAttribute("aria-pressed", type === activeType);
    b.addEventListener("click", () => {
      activeType = type;
      chipsBox.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === b));
      render();
    });
    chipsBox.appendChild(b);
  });
}

const clearBtn = document.getElementById("clear");
input.addEventListener("input", () => { clearBtn.classList.toggle("show", input.value.length > 0); render(); });
clearBtn.addEventListener("click", () => { input.value = ""; clearBtn.classList.remove("show"); input.focus(); render(); });

/* Structured data (JSON-LD) built automatically from the list above */
(function(){
  const data = {
    "@context":"https://schema.org",
    "@type":"CollectionPage",
    "name":"Digital Marketing Agencies & Marketers for Small Budgets",
    "description":"A curated directory of digital marketing agencies, websites and marketers (Facebook profiles) that work with small budgets.",
    "inLanguage":"bn",
    "mainEntity":{
      "@type":"ItemList",
      "numberOfItems":sites.length,
      "itemListElement":sites.map((s,i) => ({
        "@type":"ListItem","position":i+1,"name":s.name,"url":s.url,
        "description":clean(s.desc).replace(/\n+/g," ")
      }))
    }
  };
  const el = document.createElement("script");
  el.type = "application/ld+json";
  el.textContent = JSON.stringify(data);
  document.head.appendChild(el);
})();
document.getElementById("y").textContent = new Date().getFullYear();
buildChips();
render();
</script>
